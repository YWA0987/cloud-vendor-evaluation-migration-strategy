<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470" role="img" aria-labelledby="title desc">
<title id="title">Three-year modeled cost comparison</title>
<desc id="desc">Azure costs 243,741 dollars, Google Cloud costs 333,382 dollars, and AWS costs 423,343 dollars in the fictional academic model.</desc>
<defs><linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1930"/><stop offset="1" stop-color="#122a3b"/></linearGradient><linearGradient id="azure" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38d9bd"/><stop offset="1" stop-color="#68b6ff"/></linearGradient></defs>
<rect width="1160" height="470" rx="20" fill="url(#back)"/>
<text x="46" y="59" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="800" fill="#f3f8ff">Three-year total cost of ownership</text>
<text x="46" y="88" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#aec2d6">Modeled USD · Cloud operations + migration/training + staff time</text>
<rect x="39" y="120" width="1082" height="99" rx="14" fill="#153a49" stroke="#2b807d"/>
<text x="60" y="153" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#f3faff">Microsoft Azure</text>
<rect x="260" y="148" width="593" height="27" rx="13" fill="#284252"/>
<rect x="260" y="148" width="342" height="27" rx="13" fill="url(#azure)"/>
<text x="875" y="170" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#f3fffd">$243,741</text>
<text x="60" y="193" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#9df5de">Preferred option, pending testing</text>
<text x="60" y="270" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#eaf3ff">Google Cloud</text>
<rect x="260" y="246" width="593" height="27" rx="13" fill="#24394e"/>
<rect x="260" y="246" width="469" height="27" rx="13" fill="#7aa8f0"/>
<text x="875" y="268" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#eaf3ff">$333,382</text>
<text x="60" y="362" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#eaf3ff">AWS</text>
<rect x="260" y="338" width="593" height="27" rx="13" fill="#24394e"/>
<rect x="260" y="338" width="593" height="27" rx="13" fill="#b28ce9"/>
<text x="875" y="360" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#eaf3ff">$423,343</text>
<path d="M46 408 H1114" stroke="#3a516c"/>
<text x="46" y="437" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#b1c3d9">Planning estimates from Oct 2026. Configurations differ in performance and backup coverage.</text>
</svg>